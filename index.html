<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Davi Brito · Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ───────────── Tokens ───────────── */
:root{
  --page:#efefef; --hatch:rgba(0,0,0,.06); --paper:#fbfbfb; --card:#f4f4f4; --raise:#ffffff;
  --ink:#151515; --soft:#3d3d3d; --muted:#7b7b7b; --faint:#a8a8a8;
  --line:#e2e2e2; --line-strong:#cfcfcf; --bracket:#c9c9c9; --inv:#161616; --inv-ink:#f5f5f5;
  --ok:#16a34a; --err:#dc2626; --warn:#b45309; --live:#22c55e;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.12);
  --sans:"Manrope","Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1); --spring:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0b0b0b; --hatch:rgba(255,255,255,.05); --paper:#121212; --card:#181818; --raise:#1e1e1e;
    --ink:#eeeeee; --soft:#c9c9c9; --muted:#8d8d8d; --faint:#5d5d5d;
    --line:#262626; --line-strong:#363636; --bracket:#444444; --inv:#efefef; --inv-ink:#121212;
    --ok:#4ade80; --err:#f87171; --warn:#fbbf24;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0b0b0b; --hatch:rgba(255,255,255,.05); --paper:#121212; --card:#181818; --raise:#1e1e1e;
  --ink:#eeeeee; --soft:#c9c9c9; --muted:#8d8d8d; --faint:#5d5d5d;
  --line:#262626; --line-strong:#363636; --bracket:#444444; --inv:#efefef; --inv-ink:#121212;
  --ok:#4ade80; --err:#f87171; --warn:#fbbf24;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}

/* ───────────── Base ───────────── */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;overflow-x:hidden;color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;
  background-color:var(--page);background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 10px);
  transition:background-color .45s,color .45s}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
code,.mono{font-family:var(--mono);font-size:.86em}
svg{display:block}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.tag{display:inline-flex;align-items:center;gap:8px;padding:4px 10px;font-size:11.5px;letter-spacing:.02em;color:var(--soft);background:var(--card);border:1px solid var(--line)}
.h2{font-size:clamp(28px,4.4vw,44px);line-height:1.08;letter-spacing:-.025em;font-weight:500}
.h2>span,.h1>span{display:block}
.mute{color:var(--faint)}
.eyebrow{font:500 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.live{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 2.2s ease-in-out infinite}

/* reveal ao rolar */
.rv{opacity:0;transform:translateY(18px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.rv.in{opacity:1;transform:none}

/* moldura com cantoneiras */
.frame{position:relative;display:flex;flex-direction:column}
.frame>.card{flex:1}
.c{position:absolute;width:12px;height:12px;border:0 solid var(--bracket);pointer-events:none;transition:border-color .3s,transform .35s var(--spring)}
.c-tl{top:-6px;left:-6px;border-top-width:1.5px;border-left-width:1.5px}
.c-tr{top:-6px;right:-6px;border-top-width:1.5px;border-right-width:1.5px}
.c-bl{bottom:-6px;left:-6px;border-bottom-width:1.5px;border-left-width:1.5px}
.c-br{bottom:-6px;right:-6px;border-bottom-width:1.5px;border-right-width:1.5px}
.frame:hover>.c{border-color:var(--ink)}
.frame:hover>.c-tl{transform:translate(-3px,-3px)}
.frame:hover>.c-tr{transform:translate(3px,-3px)}
.frame:hover>.c-bl{transform:translate(-3px,3px)}
.frame:hover>.c-br{transform:translate(3px,3px)}
.card{background:linear-gradient(180deg,var(--raise),var(--card));border:1px solid var(--line);padding:clamp(14px,2vw,22px);display:flex;flex-direction:column;gap:14px;transition:border-color .3s,box-shadow .35s}
.card:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.card h3{font-size:14px;font-weight:600;letter-spacing:-.005em}
.card p{font-size:13px;line-height:1.55;color:var(--muted)}

/* ───────────── Top bar ───────────── */
.topbar{position:sticky;top:0;z-index:50;padding:12px clamp(10px,2.4vw,28px) 0}
.topbar-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:7px 7px 7px 12px;border:1px solid var(--line);
  background:color-mix(in srgb,var(--paper) 80%,transparent);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;white-space:nowrap}
.mark{width:26px;height:26px;display:grid;place-items:center;background:var(--ink);color:var(--paper);font:600 10px var(--mono);border-radius:5px}
.tabs{position:relative;display:flex;margin:0 auto;padding:3px;background:var(--card);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;z-index:1;border:0;background:none;padding:6px 14px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;transition:color .25s}
.tab[aria-selected="true"],.tab:hover{color:var(--ink)}
.tab-ind{position:absolute;z-index:0;top:3px;bottom:3px;left:0;width:0;background:var(--raise);border:1px solid var(--line-strong);transition:transform .45s var(--spring),width .45s var(--spring)}
.icon-btn{width:32px;height:32px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--muted);transition:color .2s,border-color .2s}
.icon-btn:hover{color:var(--ink);border-color:var(--line-strong)}
.icon-btn svg{width:15px;height:15px}
.i-moon{display:none}
:root[data-theme="dark"] .i-sun{display:none}
:root[data-theme="dark"] .i-moon{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .i-sun{display:none}:root:not([data-theme="light"]) .i-moon{display:block}}

/* ───────────── Layout ───────────── */
main{max-width:1180px;margin:0 auto;padding:18px clamp(10px,2.4vw,28px) 72px}
.view{display:none}
.view.active{display:block;animation:viewIn .45s var(--ease)}
@keyframes viewIn{from{opacity:0}}
.sec{background:var(--paper);border:1px solid var(--line);padding:clamp(36px,6vw,72px) clamp(16px,4vw,48px);transition:background-color .45s,border-color .45s}
.head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;margin-bottom:clamp(28px,4.5vw,52px)}
.head .sub{color:var(--muted);max-width:56ch;font-size:15px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px}
.gap-top{margin-top:30px}

/* ───────────── Controls ───────────── */
.btn{height:34px;padding:0 14px;border:1px solid var(--line-strong);background:var(--raise);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:background .2s,border-color .2s,opacity .2s,transform .15s}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{opacity:.85}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn svg{width:13px;height:13px;transition:transform .3s var(--spring)}
.btn:hover svg{transform:translateX(3px)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:1px solid var(--line);background:var(--card);font-size:12px;color:var(--soft);transition:all .2s}
button.chip:hover{border-color:var(--line-strong);color:var(--ink)}
button.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border:1px solid var(--line);background:var(--raise);font:500 10.5px var(--mono);color:var(--soft)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink)}
.badge.andamento::before{background:var(--live);animation:pulse 2.2s ease-in-out infinite}
.badge.proximo{color:var(--faint)}
.badge.proximo::before{background:none;box-shadow:inset 0 0 0 1.3px var(--faint)}
.badge.ok{color:var(--ok)} .badge.ok::before{background:var(--ok)}
.badge.err{color:var(--err)} .badge.err::before{background:var(--err)}
.badge.warn{color:var(--warn)} .badge.warn::before{background:var(--warn)}
.seg{display:inline-flex;padding:3px;background:var(--card);border:1px solid var(--line)}
.seg button{border:1px solid transparent;background:none;height:26px;padding:0 10px;font-size:12px;font-weight:500;color:var(--muted);transition:all .2s}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);border-color:var(--line-strong)}
.switch{display:inline-flex;align-items:center;gap:10px;font-size:13px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .track{width:32px;height:18px;border-radius:999px;background:var(--line-strong);position:relative;transition:background .25s;flex:none}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--raise);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .3s var(--spring)}
.switch input:checked + .track{background:var(--ink)}
.switch input:checked + .track::after{transform:translateX(14px)}
.switch input:focus-visible + .track{outline:2px solid var(--ink);outline-offset:2px}
input[type=range]{accent-color:var(--ink);width:130px}
.go{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink)}
.go svg{width:12px;height:12px;transition:transform .3s var(--spring)}
.go:hover svg{transform:translateX(3px)}

/* ───────────── Home ───────────── */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding:8px 0 clamp(40px,6vw,64px)}
.h1{font-size:clamp(36px,6vw,64px);line-height:1.04;letter-spacing:-.035em;font-weight:500;text-wrap:balance}
.lede{font-size:16px;color:var(--muted);max-width:58ch;text-wrap:pretty}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.links{display:flex;gap:18px;font-size:12.5px;color:var(--faint)}
.links a:hover{color:var(--ink)}
.stats{padding:0;gap:0;display:grid;grid-template-columns:repeat(4,1fr)}
.stat{padding:20px 22px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat b{display:block;font-size:34px;font-weight:500;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:34px}
.bento .wide{grid-column:1/-1;width:min(100%,860px);justify-self:center}
.diagram{width:100%;height:auto;overflow:visible}
.wide-copy{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 22px 20px}
.flow{stroke:var(--line-strong);fill:none;stroke-width:1.2;transition:stroke .3s}
.flow.on{stroke:var(--ink)}
.dash{stroke-dasharray:3 4;animation:dash 1.2s linear infinite}
.pkt{fill:var(--ink)}
.nd{fill:var(--raise);stroke:var(--line-strong);transition:stroke .3s}
.av{cursor:pointer;transition:transform .35s var(--spring);transform-box:fill-box;transform-origin:center}
.av:hover,.av:focus-visible{transform:scale(1.18)}
.av:hover .nd,.av:focus-visible .nd{stroke:var(--ink)}
.tip{opacity:0;transition:opacity .2s;pointer-events:none}
.av:hover .tip,.av:focus .tip{opacity:1}
.presence{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.glow{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sheets{cursor:pointer}
.sheet-new{animation:sheetIn .7s var(--spring) both}
.tool{cursor:pointer;transition:transform .3s var(--spring);transform-box:fill-box;transform-origin:center}
.tool:hover,.tool.on{transform:translateY(-2px)}
.tool.on .nd{stroke:var(--ink)}
.tool text{transition:opacity .25s}
.chart{cursor:crosshair;touch-action:none}
.line-draw{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.8s cubic-bezier(.4,.1,.2,1) .2s}
.rv.in .line-draw{stroke-dashoffset:0}
.focus{flex-direction:row;align-items:center;gap:22px}
.ring{width:92px;height:92px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--ink);stroke-dasharray:264;stroke-dashoffset:264;transition:stroke-dashoffset 1.6s cubic-bezier(.4,.1,.2,1) .3s}
.rv.in .ring .fg{stroke-dashoffset:var(--off)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;font-weight:500;letter-spacing:-.03em}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:4px;top:8px;bottom:8px;border-left:1px dashed var(--line-strong)}
.tl li{position:relative;padding:0 0 13px 24px;font-size:13.5px}
.tl li::before{content:"";position:absolute;left:0;top:6px;width:9px;height:9px;background:var(--raise);border:1.5px solid var(--ink)}
.tl time{display:block;font:500 10.5px var(--mono);color:var(--faint);letter-spacing:.04em;text-transform:uppercase}

/* ───────────── Studies ───────────── */
.filters{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:-24px 0 36px}
.study-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.study h3{font-size:17px;letter-spacing:-.015em}
.bar{height:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:var(--w);background:var(--ink)}
.rv.in .bar i{animation:grow 1.3s var(--ease) both .25s}
@keyframes grow{from{width:0}}
.bar-row{display:flex;align-items:center;gap:10px;font:500 11px var(--mono);color:var(--faint)}
.bar-row .bar{flex:1}
.notes{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:5px}
.notes li{font:11px var(--mono);padding:3px 7px;background:var(--raise);border:1px solid var(--line);color:var(--muted)}
.study-foot{margin-top:auto;padding-top:12px;border-top:1px dashed var(--line-strong);display:flex;justify-content:space-between;align-items:center;font:11px var(--mono);color:var(--faint)}
.frame.hide{display:none}

/* ───────────── Stack ───────────── */
.skill{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 0;border-top:1px dashed var(--line-strong)}
.skill:first-of-type{border-top:0;padding-top:2px}
.skill b{font-weight:600;font-size:14px}
.skill small{grid-column:1/-1;color:var(--muted);font-size:12px}
.meter{display:flex;gap:3px}
.meter i{width:14px;height:6px;background:var(--line)}
.meter i.on{background:var(--ink)}
.rv.in .meter i.on{animation:seg .5s var(--spring) both;animation-delay:calc(var(--d) * 80ms + 300ms)}
@keyframes seg{from{background:var(--line);transform:scaleY(.3)}}
.lvl{font:500 10.5px var(--mono);color:var(--muted);min-width:84px;text-align:right}
.skill-r{display:flex;align-items:center;gap:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font:11px var(--mono);color:var(--faint);margin:-24px 0 36px}
.principles{display:flex;flex-wrap:wrap;gap:6px}

/* ───────────── Cases ───────────── */
.cases{display:flex;flex-direction:column;gap:26px;max-width:900px;margin:0 auto}
.case .card{padding:0;gap:0}
.case-btn{width:100%;border:0;background:none;text-align:left;padding:20px 22px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.case-n{font:500 11px var(--mono);color:var(--faint)}
.case-btn h3{font-size:16px;margin-bottom:3px}
.case-btn p{font-size:13.5px;color:var(--muted)}
.plus{width:26px;height:26px;border:1px solid var(--line-strong);display:grid;place-items:center;transition:transform .45s var(--spring),background .3s}
.plus svg{width:11px;height:11px}
.case.open .plus{transform:rotate(45deg);background:var(--ink);color:var(--paper);border-color:var(--ink)}
.case.open>.c{border-color:var(--ink)}
.case-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--spring)}
.case.open .case-body{grid-template-rows:1fr}
.case-body>div{overflow:hidden}
.case-inner{padding:4px 22px 22px 58px;display:grid;grid-template-columns:1.2fr 1fr;gap:26px;border-top:1px dashed var(--line-strong);margin:0 22px;padding-left:36px;padding-top:18px}
.steps{list-style:none;padding:0;margin:10px 0 0;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:5px 0 5px 30px;font-size:13.5px}
.steps li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;top:6px;font:500 10.5px/18px var(--mono);color:var(--faint)}
.outcome{margin-top:10px;padding:14px 16px;background:var(--raise);border:1px solid var(--line);border-left:2px solid var(--ink);font-size:13.5px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}

/* ───────────── Lab ───────────── */
.lab-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:34px;align-items:start}
.lab-nav{position:sticky;top:84px}
.lab-nav .card{padding:8px;gap:2px}
.lab-nav a{display:flex;gap:11px;align-items:center;padding:9px;border:1px solid transparent;transition:background .2s,border-color .2s}
.lab-nav a:hover{background:var(--raise)}
.lab-nav a[aria-current="page"]{background:var(--raise);border-color:var(--line-strong)}
.lab-nav .ico{width:30px;height:30px;flex:none;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);color:var(--muted);transition:all .25s}
.lab-nav a[aria-current="page"] .ico{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lab-nav .ico svg{width:15px;height:15px}
.lab-nav b{display:block;font-size:13px;font-weight:600;line-height:1.3}
.lab-nav small{display:block;font:10.5px var(--mono);color:var(--faint);line-height:1.4}
.lab-nav-title{padding:8px 9px 6px}
#labPanel{display:flex;flex-direction:column;gap:30px;min-width:0}
.lab-head{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.lab-head p{color:var(--muted);max-width:66ch;font-size:15px}
.sim{padding:0;gap:0;overflow:hidden}
.sim-head{padding:20px 22px 0}
.sim-head h3{font-size:14px}
.sim-head p{font-size:13px;color:var(--muted);margin-top:4px}
.sim-controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line)}
.sim-controls .sp{flex:1}
.ctl{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.ctl output{font:500 11.5px var(--mono);color:var(--ink);min-width:50px}

.stage{position:relative;display:flex;justify-content:space-between;padding:70px 8% 30px;min-height:200px;
  background:radial-gradient(60% 90% at 50% 55%,var(--raise),transparent 75%)}
.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.node{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;width:84px;text-align:center}
.node-ic{width:52px;height:52px;border-radius:8px;display:grid;place-items:center;background:var(--raise);border:1px solid var(--line-strong);color:var(--ink);
  box-shadow:0 6px 12px -6px rgba(0,0,0,.12);transition:border-color .3s,box-shadow .35s,transform .35s var(--spring)}
.node-ic svg{width:21px;height:21px}
.node b{font-size:12.5px;font-weight:600;line-height:1.2}

<script type="text/plain" id="code-idempotencia">app.post("/pagamentos", async (req, res) => {
  const key = req.header("Idempotency-Key");
  if (!key) return res.status(400).send("Idempotency-Key obrigatória");

  // reserva a chave de forma atômica: só um request vence
  const reservou = await redis.set(`idem:${key}`, "processando", "NX", "EX", 86400);

  if (!reservou) {
    const salvo = await redis.get(`idem:${key}`);
    if (salvo === "processando") return res.status(409).send("em processamento");
    return res.status(201).json(JSON.parse(salvo)); // mesma resposta, sem cobrar de novo
  }

  const cobranca = await db.cobrancas.insert({ valor: req.body.valor });
  await redis.set(`idem:${key}`, JSON.stringify(cobranca), "EX", 86400);
  return res.status(201).json(cobranca);
});</script>
<script type="text/plain" id="code-retry">async function comRetry(fn, { tentativas = 8, base = 200, teto = 3200 } = {}) {
  for (let n = 0; ; n++) {
    try {
      return await fn();
    } catch (erro) {
      if (n + 1 >= tentativas || !ehTransitorio(erro)) throw erro;

      const exp = Math.min(teto, base * 2 ** n);
      const espera = Math.random() * exp; // full jitter

      await dormir(espera);
    }
  }
}

// só repita o que pode dar certo na próxima vez
const ehTransitorio = (e) => [429, 502, 503, 504].includes(e.status) || e.code === "ETIMEDOUT";</script>
<script type="text/plain" id="code-circuit">class Disjuntor {
  estado = "fechado";
  falhas = 0;
  abertoEm = 0;

  constructor(limite = 3, espera = 4000) {
    this.limite = limite;
    this.espera = espera;
  }

  async chamar(fn) {
    if (this.estado === "aberto") {
      if (Date.now() - this.abertoEm < this.espera) throw new Error("circuito aberto");
      this.estado = "meio-aberto"; // deixa uma chamada de teste passar
    }
    try {
      const r = await fn();
      this.falhas = 0;
      this.estado = "fechado";
      return r;
    } catch (e) {
      this.falhas++;
      if (this.estado === "meio-aberto" || this.falhas >= this.limite) {
        this.estado = "aberto";
        this.abertoEm = Date.now();
      }
      throw e;
    }
  }
}</script>
<script type="text/plain" id="code-ratelimit">class TokenBucket {
  constructor(capacidade, porSegundo) {
    this.capacidade = capacidade;
    this.taxa = porSegundo;
    this.tokens = capacidade;
    this.ultimo = Date.now();
  }

  permitir() {
    const agora = Date.now();
    const decorrido = (agora - this.ultimo) / 1000;
    this.tokens = Math.min(this.capacidade, this.tokens + decorrido * this.taxa);
    this.ultimo = agora;

    if (this.tokens < 1) return false; // 429 Too Many Requests
    this.tokens -= 1;
    return true;
  }
}</script>

function richTitle(s) {
  return s.split(/\n|\\n/).map(line =>
    `<span>${line.split("*").map((t, i) => !t ? "" : i % 2 ? `<span class="mute">${esc(t)}</span>` : esc(t)).join("")}</span>`).join("");
}

const frame = (inner, { cls = "", card = "", attrs = "" } = {}) =>
  `<div class="frame rv ${cls}" ${attrs}>${BRACKETS}<div class="card ${card}">${inner}</div></div>`;

function head(h) {

}

function highlight(src) {
  const re = /(\/\/[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`)|\b(const|let|async|await|function|return|if|throw|new|for|try|catch|class|constructor|this|null|true|false)\b|\b(\d+(?:\.\d+)?)\b/g;
  let out = "", i = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(i, m.index));
    const c = m[1] ? "c" : m[2] ? "s" : m[3] ? "k" : "n";
    out += `<span class="t-${c}">${esc(m[0])}</span>`;
    i = re.lastIndex;
  }
  return out + esc(src.slice(i));
}

// linha suave + área fechada passando pelos valores, dentro de uma caixa w×h
function chartPaths(values, w, h, pad) {
  const n = values.length, lo = Math.min(...values), hi = Math.max(...values), span = hi - lo || 1;
  const pts = values.map((v, i) => [pad + (n < 2 ? 0 : i / (n - 1) * (w - pad * 2)), h - pad - (v - lo) / span * (h - pad * 2)]);
  let line = "";
  pts.forEach(([x, y], i) => {
    if (!i) { line = `M${x.toFixed(1)},${y.toFixed(1)}`; return; }
    const [px, py] = pts[i - 1], cx = ((px + x) / 2).toFixed(1);
    line += ` C${cx},${py.toFixed(1)} ${cx},${y.toFixed(1)} ${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const area = `${line} L${pts[n - 1][0].toFixed(1)},${h - pad} L${pts[0][0].toFixed(1)},${h - pad} Z`;
  return { line, area, points: pts };
}

const initials = t => {
  const w = t.replace(/[·&]/g, " ").split(/\s+/).filter(x => x.length > 3);
  return (w.length > 1 ? w[0][0] + w[1][0] : (w[0] || t).slice(0, 2)).toUpperCase();
};

function mountHome() {
  // folhas de laboratório que vão "imprimindo"
  const sheets = $("#fSheets"), ids = Object.keys(LABS);
  let k = 0;
  const drawSheets = () => sheets.innerHTML = sheetsSVG(k);
  drawSheets();
  setInterval(() => { if (currentTab === "inicio" && !document.hidden && !REDUCED) { k = (k + 1) % ids.length; drawSheets(); } }, 2800);
  const openSheet = () => go("lab", ids[k]);
  sheets.addEventListener("click", openSheet);
  sheets.addEventListener("keydown", e => e.key === "Enter" && openSheet());
  const side = (sel, on) => $$(sel, $("#flowCard")).forEach(p => p.classList.toggle("on", on));
  $("#fLeft").addEventListener("mouseenter", () => side(".fl", true));
  $("#fLeft").addEventListener("mouseleave", () => side(".fl", false));
  sheets.addEventListener("mouseenter", () => side(".fr", true));
  sheets.addEventListener("mouseleave", () => side(".fr", false));

  // stack: sincroniza uma ferramenta por vez
  const sc = $("#stackCard"), tools = DATA.home.stack.tools;
  let hover = -1, auto = 0, shown = -2;
  const setOn = () => {
    const on = hover >= 0 ? hover : REDUCED ? -1 : auto;
    if (on === shown) return;
    shown = on;
    $$(".flow", sc).forEach(p => p.classList.toggle("on", +p.dataset.p === on));
    $$(".tool", sc).forEach(t => { const a = +t.dataset.t === on; t.classList.toggle("on", a); $("text", t).setAttribute("opacity", a ? 1 : 0); });
    $("#sPkt").innerHTML = on >= 0 && !REDUCED ? `<circle r="2.2" class="pkt"><animateMotion dur="1.1s" repeatCount="indefinite" path="${tilePath(on)}"/></circle>` : "";
    const lv = on >= 0 ? toolLevel(tools[on]) : 0;
    $("#sTxt").textContent = on >= 0 ? `${tools[on].toLowerCase()} · ${lv ? LEVELS[lv].toLowerCase() : "em uso"}` : `${tools.length} na stack`;
  };
  $$(".tool", sc).forEach(t => {
    const i = +t.dataset.t;
    t.addEventListener("mouseenter", () => { hover = i; setOn(); });
    t.addEventListener("focus", () => { hover = i; setOn(); });
    t.addEventListener("mouseleave", () => { hover = -1; setOn(); });
    t.addEventListener("blur", () => { hover = -1; setOn(); });
  });
  setInterval(() => { if (hover < 0 && currentTab === "inicio" && !document.hidden) { auto = (auto + 1) % TILES.length; setOn(); } }, 1700);
  setOn();

  // gráfico que dá para arrastar
  const c = DATA.home.rhythm, W = 300, H = 130, { points } = chartPaths(c.values, W, H, 14);
  const split = clamp(c.forecastFrom, 1, c.values.length - 1);
  const chart = $("#rChart"), dot = $("#rDot"), tip = $("#rTip"), cross = $("#rCross"), glow = $("#rGlow");
  const show = (i, hovering) => {
    const [x, y] = points[i], v = c.values[i];
    dot.setAttribute("cx", x); dot.setAttribute("cy", y);
    tip.setAttribute("transform", `translate(${clamp(x, 40, W - 40)},${y < 34 ? y + 22 : y - 12})`);
    $("text", tip).textContent = i >= split ? `meta · ${v}h` : `sem ${i + 1} · ${v}h`;
    cross.setAttribute("visibility", hovering ? "visible" : "hidden");
    cross.setAttribute("x1", x); cross.setAttribute("x2", x);
    if (glow) glow.style.display = hovering ? "none" : "";
  };
  chart.addEventListener("pointermove", e => {
    const r = chart.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W;
    let best = 0;
    points.forEach((p, i) => { if (Math.abs(p[0] - x) < Math.abs(points[best][0] - x)) best = i; });
    show(best, true);
  });
  chart.addEventListener("pointerleave", () => show(points.length - 1, false));
  show(points.length - 1, false);
}

/* ═════════════════════════ Simulação: palco ═════════════════════════ */
function centerOf(el, stage) {
  const r = (el.querySelector(".node-ic") || el).getBoundingClientRect(), s = stage.getBoundingClientRect();
  return { x: r.left - s.left + r.width / 2, y: r.top - s.top + r.height / 2 };
}

// desenha dois fios curvos entre cada par de nós: ida (sólido) e volta (tracejado)
function wireStage(stage) {
  const nodes = $$(".node", stage);
  if (nodes.length < 2 || !stage.isConnected) return;
  let svg = $("svg.wires", stage);
  if (!svg) {
    svg = document.createElementNS(NS, "svg");
    svg.setAttribute("class", "wires");
    stage.prepend(svg);
    new ResizeObserver(() => wireStage(stage)).observe(stage);
  }
  svg.setAttribute("viewBox", `0 0 ${stage.clientWidth} ${stage.clientHeight}`);
  const segs = {};
  let html = "";
  for (let i = 0; i < nodes.length - 1; i++) {
    const A = nodes[i], B = nodes[i + 1], a = centerOf(A, stage), b = centerOf(B, stage);
    const r = $(".node-ic", A).offsetWidth / 2 + 8, x1 = a.x + r, x2 = b.x - r, y = a.y, mx = (x1 + x2) / 2, k = 16;
    const up = `M${x1},${y - 4} C${mx},${y - 4 - k} ${mx},${y - 4 - k} ${x2},${y - 4}`;
    const dn = `M${x2},${y + 4} C${mx},${y + 4 + k} ${mx},${y + 4 + k} ${x1},${y + 4}`;
    html += `<path class="flow" data-s="${i}u" d="${up}"/><path class="flow dash" data-s="${i}d" d="${dn}"/>`;
    segs[A.dataset.n + ">" + B.dataset.n] = { d: up, id: i + "u" };
    segs[B.dataset.n + ">" + A.dataset.n] = { d: dn, id: i + "d" };
  }
  svg.innerHTML = html;
  const prev = stage._segs || {};
  Object.entries(segs).forEach(([key, s]) => { s.el = $(`[data-s="${s.id}"]`, svg); s.n = prev[key]?.n || 0; s.el.classList.toggle("on", s.n > 0); });
  stage._segs = segs;
}

// anima um pacote pelo fio entre dois nós; drop=true perde o pacote no meio do caminho
function travel(stage, from, to, { label = "", tone = "", drop = false, dur = 850 } = {}) {
  return new Promise(resolve => {
    const key = from.dataset.n + ">" + to.dataset.n;
    const seg = stage.isConnected && stage._segs?.[key];
    if (!seg) return resolve({});
    const p = document.createElement("div");
    p.className = "packet " + tone;
    p.innerHTML = label ? `<span>${label}</span>` : "";
    p.style.offsetPath = `path("${seg.d}")`;
    stage.appendChild(p);
    const cur = () => stage._segs[key];
    cur().n++; cur().el.classList.add("on");
    const release = () => { const s = cur(); s.n = Math.max(0, s.n - 1); if (!s.n) s.el.classList.remove("on"); };
    const end = drop ? 52 : 100, T = dur * end / 100;
    p.animate([{ opacity: 0 }, { opacity: 1 }], { duration: Math.min(160, T), fill: "forwards" });
    p.animate([{ offsetDistance: "0%" }, { offsetDistance: end + "%" }], { duration: T, easing: "cubic-bezier(.45,0,.25,1)", fill: "forwards" })
      .onfinish = () => {
        release();
        if (drop) {
          p.classList.add("dropped");
          const sp = $("span", p); if (sp) sp.textContent = "✕ timeout";
          p.animate([{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(26px)", opacity: 0 }],
            { duration: 650, delay: 600, easing: "ease-in", fill: "forwards" }).onfinish = () => { p.remove(); resolve({ dropped: true }); };
        } else {
          p.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: "forwards" }).onfinish = () => p.remove();
          resolve({});
        }
      };
  });
}

function flash(node, tone) {
  node.classList.remove("pulse-ok", "pulse-err", "pulse-warn", "pulse-acc");
  void node.offsetWidth;
  node.classList.add("pulse-" + tone);
  clearTimeout(node._t);
  node._t = setTimeout(() => node.classList.remove("pulse-" + tone), 700);
}

function makeLogger(ul) {
  let t0 = performance.now();
  return {
    reset() { t0 = performance.now(); ul.innerHTML = `<li class="empty" style="display:block">Nenhum evento ainda.</li>`; },
    add(who, tone, msg) {
      ul.querySelector(".empty")?.remove();
      const li = document.createElement("li");
      li.innerHTML = `<time>+${((performance.now() - t0) / 1000).toFixed(1)}s</time><b class="t-${tone}">${who}</b><span>${msg}</span>`;
      ul.prepend(li);
      while (ul.children.length > 60) ul.lastChild.remove();
    }
  };
}

      ${frame(`

          <ul class="checklist">
            <li><span class="ck y">✓</span><span>Compare <b>Nenhum</b> com <b>Full</b>: as colunas alinhadas viram uma nuvem espalhada, e o pico cai para a capacidade.</span></li>
            <li><span class="ck y">✓</span><span>Sempre defina um <b>teto</b> para a espera e um número máximo de tentativas.</span></li>
            <li><span class="ck y">✓</span><span>Repita só falhas <b>transitórias</b> (timeout, 503, 429). Um 400 vai falhar para sempre.</span></li>
            <li><span class="ck n">!</span><span>Retry sem <a class="go" href="#lab/idempotencia" style="display:inline">idempotência</a> pode duplicar efeitos.</span></li>
            <li><span class="ck n">!</span><span>Retries em várias camadas se multiplicam: 3 × 3 × 3 = 27 chamadas.</span></li>
          </ul>`)}
      </div>`;
    },
    mount(root) {
      const CL = 16, CAP = 4, BK = 200, RECOVER = 1600, MAXN = 8, CEIL = 3200;
      let jitter = "none", base = 200;
      const herd = $("#herd", root);

      function simulate() {
        const q = Array.from({ length: CL }, (_, c) => ({ c, n: 0, t: Math.random() * 80 }));
        const load = new Map(), out = [];
        while (q.length) {
          q.sort((a, b) => a.t - b.t);
          const e = q.shift(), b = Math.floor(e.t / BK), l = (load.get(b) || 0) + 1;
          load.set(b, l);
          const ok = e.t >= RECOVER && l <= CAP;
          out.push({ ...e, ok });
          if (!ok && e.n + 1 < MAXN) {
            const exp = Math.min(CEIL, base * 2 ** e.n);
            const d = jitter === "none" ? exp : jitter === "full" ? Math.random() * exp : exp / 2 + Math.random() * exp / 2;
            q.push({ c: e.c, n: e.n + 1, t: e.t + Math.max(10, d) });
          }
        }
        return { out, load };
      }

      function run() {
        const { out, load } = simulate();
        const T = Math.max(4000, Math.ceil((Math.max(...out.map(e => e.t)) + 300) / 1000) * 1000);
        const dur = REDUCED ? 1 : 2600, buckets = Math.ceil(T / BK), maxL = Math.max(CAP * 1.6, ...load.values());
        const rows = Array.from({ length: CL }, (_, c) => `<div class="herd-row" data-c="${String(c + 1).padStart(2, "0")}">${
          out.filter(e => e.c === c).map(e => `<span class="hdot ${e.ok ? "s" : "f"}" style="left:${e.t / T * 100}%;--d:${e.t / T * dur}ms"></span>`).join("")}</div>`).join("");
        const bars = Array.from({ length: buckets }, (_, b) => {
          const l = load.get(b) || 0;
          return `<i class="${l > CAP ? "over" : ""}" style="--h:${l / maxL * 100}%;--d:${b * BK / T * dur}ms"></i>`;
        }).join("");
        herd.classList.remove("run");
        herd.style.setProperty("--dur", dur + "ms");
        herd.innerHTML = `
          <div class="herd-rows">${rows}<div class="outage" style="width:${RECOVER / T * 100}%"><span>SERVIÇO FORA</span></div><div class="playhead"></div></div>
          <div class="hist">${bars}<div class="cap" style="bottom:${CAP / maxL * 100}%"><span>CAPACIDADE · 4</span></div></div>
          <div class="axis">${Array.from({ length: T / 1000 + 1 }, (_, i) => `<span>${i}s</span>`).join("")}</div>`;
        void herd.offsetWidth;
        herd.classList.add("run");

        const okE = out.filter(e => e.ok);
        const peak = Math.max(...[...load.entries()].filter(([b]) => b * BK >= RECOVER).map(([, l]) => l), 0);
        const done = okE.length ? Math.max(...okE.map(e => e.t)) : 0;
        $("#metrics", root).innerHTML = [
          [`${okE.length}/${CL}`, "clientes atendidos"],
          [out.length, "requisições no total"],
          [`<span style="color:${peak > CAP ? "var(--err)" : "inherit"}">${peak}</span>`, "pico após voltar (cap. 4)"],
          [(done / 1000).toFixed(1) + "s", "até o último sucesso"]
        ].map(([b, s]) => `<div class="metric"><b>${b}</b><span>${s}</span></div>`).join("");

        const seq = Array.from({ length: 6 }, (_, n) => Math.min(CEIL, base * 2 ** n));
        const fmt = v => jitter === "none" ? `${v}` : jitter === "full" ? `0–${v}` : `${v / 2}–${v}`;
        $("#delays", root).innerHTML = `<i>espera por tentativa (ms):</i>${seq.map((v, i) => `${i ? "<i>→</i>" : ""}<b>${fmt(v)}</b>`).join("")}<i>…</i>`;
      }

      $$("#jit button", root).forEach(b => b.onclick = () => {
        jitter = b.dataset.j;
        $$("#jit button", root).forEach(x => x.setAttribute("aria-pressed", x === b));
        run();
      });
      const baseIn = $("#base", root);
      baseIn.oninput = () => { base = +baseIn.value; $("#baseOut", root).textContent = base + " ms"; };
      baseIn.onchange = run;
      $("#runRetry", root).onclick = run;
      run();
    }
  },

        flash(N.breaker, s === "fechado" ? "ok" : s === "aberto" ? "err" : "warn");
      };
      const renderFails = () => $$("#fails i", root).forEach((e, i) => e.classList.toggle("on", i < fails));
      const push = t => { hist.push(t); if (hist.length > 36) hist.shift(); $("#spark", root).innerHTML = hist.map(h => `<i class="${h}"></i>`).join(""); };
      const open = () => { openedAt = performance.now(); setState("aberto"); };

      async function fire() {
        if (!alive) return;
        await travel(st, N.client, N.breaker, { label: "req", dur: 500 });
        if (!alive) return;
        if (state === "aberto" && performance.now() - openedAt >= COOL) setState("meio");
        if (state === "aberto" || (state === "meio" && trial)) {
          push("r");
          await travel(st, N.breaker, N.client, { label: "503 imediato", tone: "dim", dur: 380 });
          return;
        }
        const isTrial = state === "meio";
        if (isTrial) { trial = true; log.add("disjuntor", "warn", "deixando passar 1 chamada de teste"); }
        await travel(st, N.breaker, N.svc, { label: isTrial ? "teste" : "req", tone: isTrial ? "warn" : "", dur: 500 });
        if (!alive) return;
        const ok = healthy;
        flash(N.svc, ok ? "ok" : "err");
        if (!ok) await sleep(450); // timeout lento
        await travel(st, N.svc, N.breaker, { label: ok ? "200" : "timeout", tone: ok ? "ok" : "err", dur: 500 });
        if (!alive) return;
        if (ok) {
          fails = 0; push("ok");
          if (isTrial) { trial = false; log.add("serviço", "ok", "teste passou"); setState("fechado"); }
        } else {
          fails++; push("f");
          log.add("serviço", "err", `falhou (${Math.min(fails, LIMIT)}/${LIMIT})`);
          if (isTrial) { trial = false; open(); }
          else if (state === "fechado" && fails >= LIMIT) open();
        }
        renderFails();
      }

      function loop() {
        if (!alive) return;
        const cd = $("#cd", root), txt = $("#cdTxt", root);
        if (state === "aberto") {
          const left = Math.max(0, COOL - (performance.now() - openedAt));
          cd.style.transform = `scaleX(${left / COOL})`;
          txt.textContent = `testa em ${(left / 1000).toFixed(1)}s`;
          if (left === 0) setState("meio");
        } else { cd.style.transform = "scaleX(0)"; txt.textContent = "falha rápido"; }
        raf = requestAnimationFrame(loop);
      }
      const startAuto = () => { clearInterval(timer); if ($("#auto", root).checked) timer = setInterval(fire, 750); };
      const reset = () => { state = null; fails = 0; trial = false; hist = []; log.reset(); setState("fechado"); renderFails(); $("#spark", root).innerHTML = ""; };

      $$("#health button", root).forEach(b => b.onclick = () => {
        healthy = b.dataset.h === "1";
        $$("#health button", root).forEach(x => x.setAttribute("aria-pressed", x === b));
        log.add("serviço", healthy ? "ok" : "err", healthy ? "voltou ao normal" : "começou a falhar");
      });
      $("#auto", root).onchange = startAuto;
      $("#one", root).onclick = fire;
      $("#cbReset", root).onclick = reset;
      reset(); startAuto(); loop();
      return () => { alive = false; clearInterval(timer); cancelAnimationFrame(raf); };
    }
  },

  /* ────────── Rate limiting ────────── */
  ratelimit: {
    name: "Token Bucket", area: "Proteção", icon: "bucket",
    html() {
      return `
      ${labHead("Proteção", "Rate limiting\n*token bucket*", "Um balde com capacidade fixa recebe fichas a uma taxa constante. Cada requisição gasta uma ficha; sem ficha, a resposta é <code>429</code>. Assim rajadas curtas passam, mas a média fica limitada.")}

      ${frame(`
        <div class="sim-head"><h3>Simulação · balde de 8 fichas</h3>
          <p>Dispare uma rajada e veja o balde esvaziar; depois observe a recarga.</p></div>
        <div class="sim-controls">
          <div class="ctl">Recarga <input type="range" id="rate" min="0.5" max="6" step="0.5" value="2"><output id="rateOut">2 /s</output></div>
          <label class="switch"><input type="checkbox" id="tAuto"><span class="track"></span>Tráfego de 4 req/s</label>
          <span class="sp"></span>
          <button class="btn ghost" id="tbReset">Resetar</button>
          <button class="btn" id="tOne">1 requisição</button>
          <button class="btn primary" id="tBurst">Rajada × 12</button>
        </div>
        <div class="tb">
          <div class="req-col"><span class="eyebrow">Como funciona</span>
            <ul class="checklist">
              <li><span class="ck y">1</span><span>Fichas caem no balde a uma taxa fixa.</span></li>
              <li><span class="ck y">2</span><span>Cada requisição consome uma ficha.</span></li>
              <li><span class="ck n">3</span><span>Balde vazio → <code>429</code> com <code>Retry-After</code>.</span></li>
            </ul>
          </div>
          <div><div class="bucket" id="bucket"></div><div class="tb-count"><b id="tok">8.0</b> / 8 fichas</div></div>
          <div class="req-col r">
            <div class="counters"><div class="counter"><b id="cOk">0</b><span>200 aceitas</span></div><div class="counter err"><b id="cErr">0</b><span>429 limitadas</span></div></div>
            <span class="eyebrow" style="margin-top:6px">Respostas recentes</span>
            <div class="strip" id="strip"></div>
          </div>
        </div>`, { card: "sim" })}

      <div class="grid-2">
        ${codeCard("ratelimit", "token-bucket.js")}
        ${frame(`<h3>Pontos de atenção</h3>
          <ul class="checklist">
            <li><span class="ck y">✓</span><span><b>Capacidade</b> define o tamanho da rajada; <b>taxa</b> define a média sustentada.</span></li>
            <li><span class="ck y">✓</span><span>Com várias instâncias, guarde o estado no Redis com um script Lua atômico.</span></li>
            <li><span class="ck y">✓</span><span>Limite por chave de API ou usuário, não só por IP.</span></li>
            <li><span class="ck n">!</span><span>Devolva <code>Retry-After</code>: clientes bem-feitos vão respeitar.</span></li>
          </ul>`)}
      </div>`;
    },
    mount(root) {
      const CAP = 8;
      let rate = 2, tokens = CAP, last = performance.now(), ok = 0, rej = 0, raf, auto, alive = true;
      const bucket = $("#bucket", root);
      bucket.innerHTML = Array.from({ length: CAP }, () => `<div class="slot"><i></i></div>`).join("");
      const slots = $$(".slot i", bucket);
      const refill = () => { const now = performance.now(); tokens = Math.min(CAP, tokens + (now - last) / 1000 * rate); last = now; };
      const draw = () => {
        slots.forEach((s, i) => s.style.setProperty("--f", clamp(tokens - i, 0, 1).toFixed(3)));
        $("#tok", root).textContent = tokens.toFixed(1);
      };
      function loop() { if (!alive) return; refill(); draw(); raf = requestAnimationFrame(loop); }
      function req() {
        refill();
        const strip = $("#strip", root), i = document.createElement("i");
        if (tokens >= 1) { tokens -= 1; ok++; i.textContent = "200"; }
        else { rej++; i.className = "err"; i.textContent = "429"; }
        strip.prepend(i);
        while (strip.children.length > 28) strip.lastChild.remove();
        $("#cOk", root).textContent = ok; $("#cErr", root).textContent = rej;
        draw();
      }
      $("#tOne", root).onclick = req;
      $("#tBurst", root).onclick = async () => { for (let k = 0; k < 12 && alive; k++) { req(); await sleep(70); } };
      const rateIn = $("#rate", root);
      rateIn.oninput = () => { refill(); rate = +rateIn.value; $("#rateOut", root).textContent = rate + " /s"; };
      $("#tAuto", root).onchange = e => { clearInterval(auto); if (e.target.checked) auto = setInterval(req, 250); };
      $("#tbReset", root).onclick = () => { tokens = CAP; ok = rej = 0; $("#cOk", root).textContent = 0; $("#cErr", root).textContent = 0; $("#strip", root).innerHTML = ""; };
      loop();
      return () => { alive = false; cancelAnimationFrame(raf); clearInterval(auto); };
    }
  }
};

/* ═══════════════════════════ Revelar ao rolar ═══════════════════════════ */
const io = new IntersectionObserver(entries => {
  let k = 0;
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.style.transitionDelay = (k++ * 70) + "ms";
    e.target.classList.add("in");
    io.unobserve(e.target);
  });
}, { threshold: .12, rootMargin: "0px 0px -30px 0px" });

function reveal(root) {
  $$(".rv", root).forEach(el => { el.classList.remove("in"); io.observe(el); });
}

/* ═══════════════════════════ Navegação ═══════════════════════════ */
const app = $("#app");
let currentTab = null, currentLab = null, labCleanup = null;

function build() {
  const p = DATA.profile;
  $("#mark").textContent = p.initials;
  $("#brandName").textContent = p.name;
  $("#tabs").insertAdjacentHTML("beforeend", TABS.map(([id, l]) =>
    `<button class="tab" role="tab" id="tab-${id}" aria-selected="false" aria-controls="view-${id}" data-tab="${id}">${l}</button>`).join(""));
  const renders = { inicio: viewHome, sobre: viewAbout, estudos: viewStudies, stack: viewStack, resolvo: viewCases, lab: viewLab };
  app.innerHTML = TABS.map(([id]) => `<section class="view" id="view-${id}" role="tabpanel" aria-labelledby="tab-${id}" data-view="${id}">${renders[id]()}</section>`).join("");

  $("#tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) go(b.dataset.tab); });
  $("#tabs").addEventListener("keydown", e => {
    if (!["ArrowLeft", "ArrowRight"].includes(e.key)) return;
    const i = TABS.findIndex(([id]) => id === currentTab), n = (i + (e.key === "ArrowRight" ? 1 : -1) + TABS.length) % TABS.length;
    go(TABS[n][0]); $("#tab-" + TABS[n][0]).focus();
  });

  // filtros de estudo
  $("#studyFilters").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    $$("#studyFilters .chip").forEach(c => c.setAttribute("aria-pressed", c === b));
    let k = 0;
    $$("#view-estudos .frame[data-s]").forEach(s => {
      const show = !b.dataset.f || s.dataset.s === b.dataset.f;
      s.classList.toggle("hide", !show);
      if (show) { s.classList.remove("in"); s.style.transitionDelay = (k++ * 60) + "ms"; void s.offsetWidth; s.classList.add("in"); }
    });
  });

  // casos (acordeão)
  $$(".case-btn").forEach(b => b.onclick = () => {
    const c = b.closest(".case"), open = !c.classList.contains("open");
    c.classList.toggle("open", open); b.setAttribute("aria-expanded", open);
  });

  // copiar código
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-copy]"); if (!b) return;
    navigator.clipboard?.writeText($("#code-" + b.dataset.copy).textContent).then(() => {
      const s = $("span", b); s.textContent = "Copiado"; setTimeout(() => s.textContent = "Copiar", 1400);
    }).catch(() => {});
  });

  // links internos (#aba ou #lab/id) navegam via JS, sem alterar a URL
  document.addEventListener("click", e => {
    const a = e.target.closest('a[href^="#"]'); if (!a) return;
    e.preventDefault();
    const [tab, sub] = a.getAttribute("href").slice(1).split("/");
    if (tab) go(tab, sub);
  });

  addEventListener("resize", moveInd);
  mountHome();
  go("inicio");
}

function moveInd() {
  const b = $(`.tab[data-tab="${currentTab}"]`), ind = $("#tabInd");
  if (!b) return;
  ind.style.width = b.offsetWidth + "px";
  ind.style.transform = `translateX(${b.offsetLeft - 3}px)`;
}

function go(tab0, sub) {
  const tab = TABS.some(([id]) => id === tab0) ? tab0 : "inicio";
  if (tab !== currentTab) {
    $$(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === tab));
    $$(".view").forEach(v => v.classList.remove("active"));
    const v = $(`.view[data-view="${tab}"]`);
    v.classList.add("active");
    currentTab = tab;
    moveInd();
    $(`.tab[data-tab="${tab}"]`).scrollIntoView({ block: "nearest", inline: "nearest" });
    scrollTo({ top: 0, behavior: "auto" });
    reveal(v);
    if (tab === "inicio") countUp();
  }
  if (tab === "lab") openLab(LABS[sub] ? sub : currentLab || "idempotencia");
  else closeLab();
}

function openLab(id) {
  if (id === currentLab && labCleanup !== null) return;
  closeLab();
  currentLab = id;
  $$("#labNav a").forEach(a => a.dataset.lab === id ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  const panel = $("#labPanel");
  panel.innerHTML = LABS[id].html();
  labCleanup = LABS[id].mount(panel) || (() => {});
  $$(".stage", panel).forEach(wireStage);
  reveal(panel);
}
function closeLab() {
  if (labCleanup) labCleanup();
  labCleanup = null;
  if (currentTab !== "lab") { const p = $("#labPanel"); if (p) p.innerHTML = ""; }
}

function countUp() {
  $$("[data-count]").forEach(el => {
    const target = +el.dataset.count, t0 = performance.now() + 250, D = REDUCED ? 1 : 1100;
    const step = now => { const k = clamp((now - t0) / D, 0, 1); el.textContent = Math.round(target * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

/* tema */
(() => {
  const root = document.documentElement;
  try { const t = localStorage.getItem("portal-theme"); if (t) root.dataset.theme = t; } catch (e) {}
  $("#themeBtn").onclick = () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("portal-theme", root.dataset.theme); } catch (e) {}
  };
})();

document.fonts?.ready.then(() => { moveInd(); $$("#labPanel .stage").forEach(wireStage); });
build();
</script>
