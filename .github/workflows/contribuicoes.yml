# Atualiza data/contribuicoes.json com o calendário público de contribuições do GitHub.
# Roda uma vez por dia, manualmente (Actions → Run workflow) ou quando o script muda.
name: Atualizar contribuições

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/contribuicoes.mjs"
      - ".github/workflows/contribuicoes.yml"

permissions:
  contents: write

concurrency:
  group: contribuicoes
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Baixar contribuições
        run: node scripts/contribuicoes.mjs daviribrito

      - name: Commitar se mudou
        run: |
          git add data/contribuicoes.json
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualiza contribuições do GitHub"
          git push
